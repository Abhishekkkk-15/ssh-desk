name: Release

# Manual only — always builds from the chosen ref and publishes/updates tag v0.1.0.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: v0.1.0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          # macos-13 was retired Dec 2025; jobs on that label queue forever.
          # macos-15-intel is the last hosted x86_64 macOS runner (until ~Fall 2027).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p ssh-desk --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG}"
          BIN="target/${{ matrix.target }}/release/ssh-desk"
          STAGE="ssh-desk-${VERSION}-${{ matrix.target }}"
          mkdir -p dist/"$STAGE"
          cp "$BIN" dist/"$STAGE"/ssh-desk
          chmod +x dist/"$STAGE"/ssh-desk
          cp README.md LICENSE dist/"$STAGE"/ 2>/dev/null || cp README.md dist/"$STAGE"/
          tar -C dist -czf "dist/${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=dist/${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG
          $stage = "ssh-desk-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ssh-desk.exe" "dist/$stage/ssh-desk.exe"
          if (Test-Path README.md) { Copy-Item README.md "dist/$stage/" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "dist/$stage/" }
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=dist/$stage.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-desk-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Replace existing v0.1.0 assets (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            mapfile -t assets < <(gh release view "${RELEASE_TAG}" --json assets -q '.assets[].name')
            for name in "${assets[@]+"${assets[@]}"}"; do
              [[ -n "$name" ]] || continue
              echo "removing asset: $name"
              gh release delete-asset "${RELEASE_TAG}" "$name" --yes
            done
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ssh-desk ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
