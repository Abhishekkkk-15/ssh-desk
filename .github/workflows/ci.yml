name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Style warnings are allowed until a dedicated lint-cleanup pass;
        # correctness/suspicious still fail the build via default clippy denies.
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: cargo test
        run: cargo test --workspace --all-targets
