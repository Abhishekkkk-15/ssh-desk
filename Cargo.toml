[workspace]
resolver = "2"
members = [
    "crates/ssh-desk",
    "crates/ssh-core",
    "crates/ssh-vault",
    "crates/ssh-wm",
    "crates/ssh-os",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["ssh-desk contributors"]
repository = "https://github.com/example/ssh-desk"

[workspace.dependencies]
ssh-core = { path = "crates/ssh-core" }
ssh-vault = { path = "crates/ssh-vault" }
ssh-wm = { path = "crates/ssh-wm" }
ssh-os = { path = "crates/ssh-os" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
russh = "0.54"
russh-sftp = "2"
async-trait = "0.1"
futures = "0.3"
arboard = "3"
age = "0.11"
zeroize = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
